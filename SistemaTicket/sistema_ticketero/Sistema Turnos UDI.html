  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        if (!entry.compressed && entry.mime.indexOf('image/') === 0) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' + entry.data;
          return;
        }
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

    tiq:'area', selArea:null, selPref:false,\n    caja:'atencion',\n    opFlow:'login', opUser:null, opCajaNum:null,\n    monitor:'normal',\n    gestion:'operadores',\n    now:new Date()\n  };\n  componentDidMount(){ this._t=setInterval(()=>this.setState({now:new Date()}),1000); }\n  componentWillUnmount(){ if(this._t) clearInterval(this._t); }\n\n  fmtDate(d){\n    const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];\n    const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];\n    return `${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;\n  }\n  fmtTime(d){ const p=n=>String(n).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }\n\n  renderVals(){\n    const s=this.state, set=p=>this.setState(p);\n    const rojo=this.props.rojo??'#E30613';\n    const pref=this.props.pref??'#F2A900';\n    const institucion=this.props.institucion??'Universidad de Desarrollo e Innovación';\n\n    const AREAS={\n      caja:{key:'caja',label:'Caja',letra:'C',color:rojo},\n      registro:{key:'registro',label:'Registro',letra:'R',color:'#1565C0'},\n      marketing:{key:'marketing',label:'Marketing',letra:'M',color:'#7A3FF2'},\n    };\n\n    // ── NAV ──\n    const nav={\n      tiqOn:s.screen==='tiquetero', tiqOff:s.screen!=='tiquetero',\n      monOn:s.screen==='monitor',   monOff:s.screen!=='monitor',\n      cajaOn:s.screen==='caja',     cajaOff:s.screen!=='caja',\n      gestOn:s.screen==='gestion',  gestOff:s.screen!=='gestion',\n    };\n\n    // ── TABS ──\n    const tab=(label,a,onClick)=>({label,onClick,active:a});\n    let tabs=[], hideTabs=false;\n    const metaMap={\n      tiquetero:{t:'Tiquetero',s:'Kiosko táctil · solicitud de ficha'},\n      monitor:{t:'Monitor',s:'Pantalla de visualización · solo lectura'},\n      caja:{t:'Operador',s:s.opFlow==='login'?'Inicio de sesión':s.opFlow==='selectCaja'?'Selección de ventanilla':'Ventanilla '+(s.opCajaNum||'')},\n      gestion:{t:'Gestión',s:'Administración del sistema'},\n    };\n    if(s.screen==='tiquetero'){\n      tabs=[tab('1 · Área',s.tiq==='area',()=>set({tiq:'area'})),\n            tab('2 · Tipo',s.tiq==='tipo',()=>set({tiq:'tipo',selArea:s.selArea||'caja'})),\n            tab('3 · Ficha',s.tiq==='ficha',()=>set({tiq:'ficha',selArea:s.selArea||'caja'}))];\n    } else if(s.screen==='monitor'){\n      tabs=[tab('Llamado normal',s.monitor==='normal',()=>set({monitor:'normal'})),\n            tab('Llamado preferencial',s.monitor==='preferencial',()=>set({monitor:'preferencial'}))];\n    } else if(s.screen==='caja'){\n      if(s.opFlow==='activo'){\n        tabs=[tab('Libre',s.caja==='libre',()=>set({caja:'libre'})),\n              tab('En atención',s.caja==='atencion',()=>set({caja:'atencion'})),\n              tab('En pausa',s.caja==='pausa',()=>set({caja:'pausa'}))];\n      } else { hideTabs=true; }\n    } else {\n      tabs=[tab('Operadores',s.gestion==='operadores',()=>set({gestion:'operadores'})),\n            tab('Usuarios',s.gestion==='usuarios',()=>set({gestion:'usuarios'}))];\n    }\n    const showTabBar=!hideTabs;\n    const tslot=i=>{const t=tabs[i];return t?{on:!!t.active,off:!t.active,label:t.label,onClick:t.onClick}:{on:false,off:false,label:'',onClick:()=>{}};};\n    const tab0=tslot(0),tab1=tslot(1),tab2=tslot(2);\n\n    // ── TIQUETERO ──\n    const fArea=AREAS[s.selArea||'caja'];\n    const fichaColor=s.selPref?pref:fArea.color;\n\n    // ── MONITOR ──\n    const hero=s.monitor==='preferencial'\n      ?{turno:'R-022',caja:5,pref:true,color:pref}\n      :{turno:'C-045',caja:3,pref:false,color:rojo};\n    const histBase=[{turno:'C-045',caja:3,pref:false},{turno:'R-022',caja:5,pref:true},{turno:'C-044',caja:1,pref:false},{turno:'M-008',caja:4,pref:false},{turno:'R-020',caja:2,pref:false}];\n    const historialView=histBase.map((h,i)=>({...h,color:h.pref?pref:'#E8EAED',op:String(1-i*0.16)}));\n\n    // ── OPERADOR ──\n    const isOpLogin=s.opFlow==='login';\n    const isOpSelect=s.opFlow==='selectCaja';\n    const isOpActivo=s.opFlow==='activo';\n    const showLogout=s.screen==='caja'&&s.opFlow==='activo';\n    const opNombre=s.opUser?s.opUser.nombre:'Operador';\n    const opArea=s.opUser?s.opUser.area:'Caja';\n    const ventNum=s.opCajaNum||3;\n    const doLogin=()=>set({opFlow:'selectCaja',opUser:{nombre:'María Soliz',usuario:'msoliz',area:'Caja'}});\n    const doLogout=()=>set({opFlow:'login',opUser:null,opCajaNum:null,caja:'atencion'});\n    const cajasRaw=[\n      {n:1,area:'Caja',libre:true,operador:null},\n      {n:2,area:'Registro',libre:false,operador:'José Áñez'},\n      {n:3,area:'Caja',libre:true,operador:null},\n      {n:4,area:'Marketing',libre:false,operador:'Diego Rocha'},\n      {n:5,area:'Registro',libre:false,operador:'Ana Áñez'},\n    ];\n    const cajasDisp=cajasRaw.map(c=>({...c,ocupada:!c.libre,\n      areaColor:c.area==='Caja'?rojo:c.area==='Registro'?'#1565C0':'#7A3FF2',\n      onClick:c.libre?()=>set({opFlow:'activo',opCajaNum:c.n,caja:'atencion'}):()=>{}}));\n    const cajaSt={\n      libreOn:s.caja==='libre',  libreOff:s.caja!=='libre',\n      ocupOn:s.caja==='atencion', ocupOff:s.caja!=='atencion',\n      pausaOn:s.caja==='pausa',  pausaOff:s.caja!=='pausa',\n    };\n\n    // ── GESTIÓN ──\n    const cajasData=[\n      {n:1,area:'caja',operador:'María Soliz',estado:'Atendiendo',turno:'C-045'},\n      {n:2,area:'registro',operador:'José Áñez',estado:'Libre',turno:'—'},\n      {n:3,area:'caja',operador:'Lucía Vaca',estado:'Atendiendo',turno:'C-046'},\n      {n:4,area:'marketing',operador:'Diego Rocha',estado:'Pausa',turno:'—'},\n      {n:5,area:'registro',operador:'Ana Áñez',estado:'Atendiendo',turno:'R-021'},\n    ];\n    const estC={Atendiendo:'#1F8A4C',Libre:'#1565C0',Pausa:pref,Cerrada:'#B80410'};\n    const cajasView=cajasData.map(c=>({...c,\n      areaLabel:AREAS[c.area].label,areaColor:AREAS[c.area].color,\n      estadoColor:estC[c.estado],rowBg:c.n%2?'#fff':'#FAFAFB'}));\n    const usuarios=[\n      {nombre:'María Soliz',usuario:'msoliz',rol:'Operador',area:'caja',estado:'Activo',codigo:'USR-001'},\n      {nombre:'José Áñez',usuario:'janez',rol:'Operador',area:'registro',estado:'Activo',codigo:'USR-002'},\n      {nombre:'Diego Rocha',usuario:'drocha',rol:'Operador',area:'marketing',estado:'Activo',codigo:'USR-003'},\n      {nombre:'Carla Suárez',usuario:'csuarez',rol:'Supervisor',area:'todas',estado:'Activo',codigo:'ADM-001'},\n      {nombre:'Luis Méndez',usuario:'lmendez',rol:'Administrador',area:'todas',estado:'Inactivo',codigo:'ADM-000'},\n    ];\n    const usuariosView=usuarios.map(u=>({...u,\n      iniciales:u.nombre.split(' ').map(x=>x[0]).slice(0,2).join(''),\n      areaLabel:u.area==='todas'?'Todas las áreas':AREAS[u.area].label,\n      estadoColor:u.estado==='Activo'?'#1F8A4C':'#B0B4B9',\n      rolBg:u.rol==='Administrador'?'#FEE9EA':u.rol==='Supervisor'?'#FFF4DB':'#EEF1F5',\n      rolColor:u.rol==='Administrador'?rojo:u.rol==='Supervisor'?'#B7860B':'#5B6166'}));\n\n    return {\n      nav, tab0, tab1, tab2, showTabBar, showLogout, meta:metaMap[s.screen], institucion,\n      isTiq:s.screen==='tiquetero', isMon:s.screen==='monitor', isCaja:s.screen==='caja', isGest:s.screen==='gestion',\n      tiqArea:s.tiq==='area', tiqTipo:s.tiq==='tipo', tiqFicha:s.tiq==='ficha',\n      isOpLogin, isOpSelect, isOpActivo,\n      opNombre, opArea, ventNum, cajasDisp, cajaSt, doLogin, doLogout,\n      cajaLibre:s.caja==='libre', cajaAtencion:s.caja==='atencion', cajaPausa:s.caja==='pausa',\n      goCajaLibre:()=>set({caja:'libre'}), goCajaOcup:()=>set({caja:'atencion'}), goCajaPausa:()=>set({caja:'pausa'}),\n      gestOperadores:s.gestion==='operadores', gestUsuarios:s.gestion==='usuarios',\n      goTiq:()=>set({screen:'tiquetero'}), goMon:()=>set({screen:'monitor'}),\n      goCaja:()=>set({screen:'caja'}), goGest:()=>set({screen:'gestion'}),\n      pickCaja:()=>set({selArea:'caja',tiq:'tipo'}),\n      pickRegistro:()=>set({selArea:'registro',tiq:'tipo'}),\n      pickMarketing:()=>set({selArea:'marketing',tiq:'tipo'}),\n      pickNormal:()=>set({selPref:false,tiq:'ficha'}),\n      pickPref:()=>set({selPref:true,tiq:'ficha'}),\n      volverArea:()=>set({tiq:'area'}),\n      nuevaFicha:()=>set({tiq:'area',selArea:null,selPref:false}),\n      fichaCodigo:fArea.letra+'-045', fichaColor,\n      fichaAreaLabel:fArea.label,\n      fichaTipoLabel:s.selPref?'Atención preferencial':'Estudiante · Normal',\n      hero, heroPref:hero.pref, historialView,\n      cajasView, usuariosView,\n      fechaLarga:this.fmtDate(s.now), hora:this.fmtTime(s.now),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
